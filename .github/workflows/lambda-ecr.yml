name: Build and Push Lambda Image

on:
  push:
    paths:
      - "lambda/app/main.py"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: team-randomizer-lambda

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.output-image.outputs.image-uri }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./lambda
          file: ./lambda/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Output image URI
        id: output-image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          LATEST_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          {
            echo "### ECR Images"
            echo ""
            echo "Immutable image: \\`${IMAGE_URI}\\`"
            echo "Latest image: \\`${LATEST_URI}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
