name: Terraform

on:
  push:
    branches:
      - 18-terraform-apigw-lambda
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform command to run'
        required: true
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy

permissions:
  id-token: write   # required for OIDC
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      HAS_AWS_ROLE: ${{ secrets.AWS_TF_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS credentials (OIDC)
        # skip entirely if the role secret isn't configured yet, so init-only runs still work
        if: ${{ env.HAS_AWS_ROLE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        # push events have no inputs.action, so default to plan; requires credentials
        if: ${{ (github.event_name == 'push' || inputs.action == 'plan') && env.HAS_AWS_ROLE == 'true' }}
        env:
          TF_VAR_firebase_service_account_json: ${{ secrets.SERVICEACCOUNTKEY }}
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        env:
          TF_VAR_firebase_service_account_json: ${{ secrets.SERVICEACCOUNTKEY }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

